<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Market Kasa</title>
<style>
:root{color-scheme:light dark;--bg:#f2f6f2;--card:#fff;--ink:#14211a;--mut:#667a6d;--line:#d9e4dc;--acc:#1f9d55;--on:#fff;--bad:#d6334a;--amb:#b7791f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101810;--card:#1b271c;--ink:#fff;--mut:#a5b6a5;--line:#304333;--acc:#75bd75;--on:#102010;--amb:#ffd27a}}
:root[data-theme="dark"]{--bg:#101810;--card:#1b271c;--ink:#fff;--mut:#a5b6a5;--line:#304333;--acc:#75bd75;--on:#102010;--amb:#ffd27a}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;min-height:100%}
#app{max-width:440px;margin:auto;padding:16px 14px 110px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
h1{font-size:22px}#st{font-size:11px;color:var(--mut);text-align:right;max-width:50%}
.tab{display:none}.tab.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
label{display:block;font-size:13px;color:var(--mut);margin:0 0 6px}
.inp{width:100%;padding:15px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font-size:18px;outline:none;margin-bottom:12px}
.inp:focus{border-color:var(--acc)}
.btn{width:100%;padding:15px;border:0;border-radius:12px;background:var(--acc);color:var(--on);font-size:16px;font-weight:700;cursor:pointer}
.btn:active{transform:scale(.98)}.btn.alt{background:var(--bg);color:var(--ink);border:1px solid var(--line)}.btn.bad{background:var(--bad);color:#fff}
.btn.sm{width:auto;padding:8px 12px;font-size:13px}
.seg{display:flex;gap:8px;margin-bottom:14px}.seg button{flex:1;padding:13px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font-size:15px;font-weight:700;cursor:pointer}
.seg button.on{background:var(--acc);color:var(--on);border-color:var(--acc)}
.tut{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;color:var(--mut)}.tut b{font-size:26px;color:var(--acc)}
.ri{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.ri:last-child{border:0}.ri div{min-width:0;overflow-wrap:anywhere}.ri small{display:block;color:var(--mut);font-size:12px}
.tot{display:flex;justify-content:space-between;align-items:center;margin:14px 0 12px}.tot b{font-size:32px;color:var(--acc)}
.empty{text-align:center;color:var(--mut);padding:12px 0;font-size:14px}
.big{font-size:38px;font-weight:800;color:var(--acc);overflow-wrap:anywhere}
.mut{color:var(--mut);font-size:14px;margin-top:6px}
.ph{display:flex;justify-content:space-between;gap:10px;font-weight:700;font-size:17px;cursor:pointer}.ph b{color:var(--amb);white-space:nowrap}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;border:0;background:none;color:var(--mut);font-size:12px;font-weight:700;padding:6px;cursor:pointer}
nav button span{display:block;font-size:22px}nav button.on{color:var(--acc)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:50}.sheet.show{display:flex}
.sh{width:100%;max-width:440px;background:var(--bg);border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto}
.sh .btn{margin-bottom:10px}
#toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translate(-50%,-90px);background:var(--acc);color:var(--on);padding:10px 18px;border-radius:12px;font-weight:700;z-index:99;transition:transform .25s;max-width:90%}
#toast.show{transform:translate(-50%,0)}
.foot{text-align:center;color:var(--mut);font-size:12px;margin-top:20px}
</style>
</head>
<body>
<div id="app">
<header><h1>🛒 Market Kasa</h1><div id="st"></div></header>

<section class="tab on" id="t0">
 <div class="seg" id="modeSeg"><button data-m="weight" class="on">⚖️ Tartılı</button><button data-m="piece">🔢 Adetli</button></div>
 <div class="card">
  <label id="lq" for="q">Ağırlık (gram)</label>
  <input class="inp" id="q" type="number" inputmode="decimal" min="0" step="any" placeholder="Örn: 750">
  <label id="lp" for="p">Kilo fiyatı (TL)</label>
  <input class="inp" id="p" type="number" inputmode="decimal" min="0" step="any" placeholder="Örn: 45">
  <label for="n">Ürün adı (isteğe bağlı)</label>
  <input class="inp" id="n" placeholder="Örn: elma">
  <div class="tut"><span>Tutar</span><b id="prev">0,00 TL</b></div>
  <button class="btn" id="add">+ Fişe Ekle</button>
 </div>
 <div class="card">
  <div id="cart"></div>
  <div class="tot"><span>Toplam</span><b id="bt">0,00 TL</b></div>
  <button class="btn" id="pay">Öde</button>
 </div>
</section>

<section class="tab" id="t1">
 <div class="card"><label>Bugünkü ciro</label><div class="big" id="ct">0,00 TL</div><div class="mut" id="c1"></div><div class="mut" id="c2"></div></div>
 <div class="card"><div id="sl"></div></div>
 <button class="btn alt" id="rst">Ciroyu sıfırla</button>
</section>

<section class="tab" id="t2">
 <div class="card"><label>Toplam alacak</label><div class="big" id="dt">0,00 TL</div></div>
 <div class="card">
  <label for="dn">Yeni borç yaz</label>
  <input class="inp" id="dn" list="names" placeholder="İsim">
  <input class="inp" id="da" type="number" inputmode="decimal" placeholder="Tutar (TL)">
  <input class="inp" id="dnote" placeholder="Ne verildi? (örn: 2 ekmek)">
  <button class="btn" id="dadd">Borç Yaz</button>
 </div>
 <div id="dl"></div>
</section>
<div class="foot">Bu site Furkan tarafından yapılmıştır ❤️</div>
</div>

<nav id="nav"><button class="on" data-t="0"><span>🧾</span>Kasa</button><button data-t="1"><span>📊</span>Ciro</button><button data-t="2"><span>📒</span>Borç</button></nav>

<div class="sheet" id="sheet"><div class="sh">
 <label>Ödenecek tutar</label><div class="big" id="pt">0,00 TL</div>
 <label for="given" style="margin-top:12px">Alınan para (para üstü için, isteğe bağlı)</label>
 <input class="inp" id="given" type="number" inputmode="decimal" placeholder="Örn: 100">
 <div class="tut"><span>Para üstü</span><b id="chg">0,00 TL</b></div>
 <label for="pn">Veresiye ise kişi adı</label>
 <input class="inp" id="pn" list="names" placeholder="İsim">
 <button class="btn" data-p="nakit">💵 Nakit</button>
 <button class="btn" data-p="kart">💳 Kart</button>
 <button class="btn alt" data-p="veresiye">📒 Veresiye (borca yaz)</button>
 <button class="btn alt" id="pcancel">Vazgeç</button>
</div></div>
<datalist id="names"></datalist>
<div id="toast"></div>

<script>
const $=id=>document.getElementById(id);
const fmt=n=>n.toLocaleString("tr-TR",{minimumFractionDigits:2,maximumFractionDigits:2})+" TL";
const num=n=>n.toLocaleString("tr-TR",{maximumFractionDigits:2});
const lc=s=>s.toLocaleLowerCase("tr-TR");
const dayKey=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const sum=a=>a.reduce((x,s)=>x+s.total,0);
const owed=p=>p.entries.reduce((s,e)=>s+e.amt,0);
function h(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("show"),2200)}
function lsGet(k){try{const d=JSON.parse(localStorage.getItem(k));return Array.isArray(d)?d:[]}catch(e){return[]}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
const K={s:"market-ciro-v1",d:"market-borc-v1",c:"market-sepet-v1"};
let db=null,mode="weight";
let cart=lsGet(K.c).filter(x=>x&&Number.isFinite(x.total)&&typeof x.detail==="string");
let sales=lsGet(K.s).filter(x=>x&&Number.isFinite(x.total)&&Number.isFinite(x.ts)&&typeof x.day==="string");
let debts=lsGet(K.d).filter(x=>x&&typeof x.name==="string"&&Array.isArray(x.entries)).map(x=>({name:x.name,entries:x.entries.filter(e=>e&&Number.isFinite(e.amt)&&Number.isFinite(e.ts)).map(e=>({ts:e.ts,amt:e.amt,note:typeof e.note==="string"?e.note:""}))}));
const open=new Set();
const dbFail=e=>toast("Kaydedilemedi: "+((e&&e.message)||"bağlantı sorunu"));

/* veri */
function pushSale(s){if(db)db.collection("sales").add(s).catch(dbFail);else{sales.push(s);lsSet(K.s,sales);renderAll()}}
function removeSale(s){if(db&&s.id)db.doc("sales/"+s.id).delete().catch(dbFail);else{sales=sales.filter(x=>x!==s);lsSet(K.s,sales);renderAll()}}
function clearSales(){if(db)sales.forEach(s=>{if(s.id)db.doc("sales/"+s.id).delete().catch(dbFail)});else{sales=[];lsSet(K.s,sales);renderAll()}}
function pushEntry(e){
  if(db){db.collection("debtEntries").add(e).catch(dbFail);return}
  let p=debts.find(x=>lc(x.name)===lc(e.name));
  if(!p){p={name:e.name,entries:[]};debts.push(p)}
  p.entries.push({ts:e.ts,amt:e.amt,note:e.note});lsSet(K.d,debts);renderAll();
}
function removeEntry(p,e){if(db&&e.id)db.doc("debtEntries/"+e.id).delete().catch(dbFail);else{p.entries=p.entries.filter(z=>z!==e);lsSet(K.d,debts);renderAll()}}
function removePerson(p){if(db)p.entries.forEach(e=>{if(e.id)db.doc("debtEntries/"+e.id).delete().catch(dbFail)});else{debts=debts.filter(z=>z!==p);lsSet(K.d,debts);renderAll()}}
function addDebt(name,amt,note){
  name=name.trim();if(!name){toast("Lütfen isim yaz");return false}
  const p=debts.find(x=>lc(x.name)===lc(name));
  pushEntry({name:p?p.name:name,ts:Date.now(),amt:amt,note:note.trim()});return true;
}

/* kasa */
function total(){const q=Number($("q").value),p=Number($("p").value);if(!(q>0)||!(p>0))return 0;return mode==="weight"?q/1000*p:q*p}
function setMode(m){
  mode=m;$("q").value="";$("p").value="";
  $("lq").textContent=m==="weight"?"Ağırlık (gram)":"Kaç adet?";
  $("lp").textContent=m==="weight"?"Kilo fiyatı (TL)":"Tanesi kaç TL?";
  $("q").placeholder=m==="weight"?"Örn: 750":"Örn: 3";$("p").placeholder=m==="weight"?"Örn: 45":"Örn: 25";
  document.querySelectorAll("#modeSeg button").forEach(b=>b.classList.toggle("on",b.dataset.m===m));
  $("prev").textContent=fmt(0);
}
document.querySelectorAll("#modeSeg button").forEach(b=>b.addEventListener("click",()=>setMode(b.dataset.m)));
["q","p"].forEach(i=>$(i).addEventListener("input",()=>$("prev").textContent=fmt(total())));
$("add").addEventListener("click",()=>{
  const t=total();if(!(t>0)){toast("Miktar ve fiyat yaz");return}
  const q=Number($("q").value),p=Number($("p").value),n=$("n").value.trim();
  cart.push({total:t,detail:(n?n+" · ":"")+(mode==="weight"?num(q)+" g × "+num(p)+" TL/kg":num(q)+" adet × "+num(p)+" TL")});
  lsSet(K.c,cart);$("q").value="";$("p").value="";$("n").value="";$("prev").textContent=fmt(0);$("q").focus();renderCart();
});
function renderCart(){
  const c=$("cart");c.innerHTML="";
  if(!cart.length)c.appendChild(h("div","empty","Fiş boş."));
  cart.forEach((it,i)=>{
    const r=h("div","ri"),d=h("div");d.appendChild(h("b","",fmt(it.total)));d.appendChild(h("small","",it.detail));
    const x=h("button","btn sm bad","Sil");x.addEventListener("click",()=>{cart.splice(i,1);lsSet(K.c,cart);renderCart()});
    r.append(d,x);c.appendChild(r);
  });
  $("bt").textContent=fmt(sum(cart));
}

/* ödeme */
$("pay").addEventListener("click",()=>{
  if(!cart.length){toast("Fiş boş");return}
  $("pt").textContent=fmt(sum(cart));$("given").value="";$("chg").textContent=fmt(0);$("pn").value="";$("sheet").classList.add("show");
});
$("given").addEventListener("input",()=>{
  const t=sum(cart),g=Number($("given").value);
  $("chg").textContent=!(g>0)?fmt(0):g>=t?fmt(g-t):"Eksik: "+fmt(t-g);
});
const closePay=()=>$("sheet").classList.remove("show");
$("pcancel").addEventListener("click",closePay);
$("sheet").addEventListener("click",e=>{if(e.target===$("sheet"))closePay()});
document.querySelectorAll("[data-p]").forEach(b=>b.addEventListener("click",()=>{
  const m=b.dataset.p,t=sum(cart),lines=cart.map(i=>i.detail).join(", ");
  if(!cart.length){closePay();return}
  if(m==="veresiye"){if(!addDebt($("pn").value,t,lines))return}
  else{const n=new Date();pushSale({ts:n.getTime(),day:dayKey(n),total:t,pay:m,lines:lines})}
  cart=[];lsSet(K.c,cart);closePay();
  toast(m==="veresiye"?"Borca yazıldı":"Satış tamam: "+fmt(t));renderAll();
}));

/* ciro */
function renderCiro(){
  const today=dayKey(new Date()),t=sales.filter(s=>s.day===today),sold=t.filter(s=>s.type!=="tahsilat");
  $("ct").textContent=fmt(sum(t));
  $("c1").textContent="💵 Nakit "+fmt(sum(sold.filter(s=>s.pay!=="kart")))+" · 💳 Kart "+fmt(sum(sold.filter(s=>s.pay==="kart")));
  $("c2").textContent="🤝 Borç tahsilatı "+fmt(sum(t.filter(s=>s.type==="tahsilat")))+" · "+sold.length+" satış";
  const l=$("sl");l.innerHTML="";
  if(!t.length)l.appendChild(h("div","empty","Bugün işlem yok."));
  t.slice().sort((a,b)=>b.ts-a.ts).forEach(s=>{
    const r=h("div","ri"),d=h("div"),tm=new Date(s.ts).toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"});
    d.appendChild(h("b","",fmt(s.total)));
    d.appendChild(h("small","",tm+" · "+(s.type==="tahsilat"?"Tahsilat: "+(s.who||""):(s.pay==="kart"?"Kart · ":"Nakit · ")+(s.lines||""))));
    const x=h("button","btn sm bad","Sil");x.addEventListener("click",()=>{if(confirm("Bu işlem silinsin mi?"))removeSale(s)});
    r.append(d,x);l.appendChild(r);
  });
}
$("rst").addEventListener("click",()=>{if(sales.length&&confirm("Tüm ciro kayıtları silinecek. Emin misin?"))clearSales()});

/* borç */
$("dadd").addEventListener("click",()=>{
  const a=Number($("da").value);if(!(a>0)){toast("Geçerli tutar yaz");return}
  if(addDebt($("dn").value,a,$("dnote").value)){$("dn").value="";$("da").value="";$("dnote").value="";toast("Borç yazıldı")}
});
function renderDebts(){
  const dl=$("names");dl.innerHTML="";debts.forEach(p=>{const o=document.createElement("option");o.value=p.name;dl.appendChild(o)});
  $("dt").textContent=fmt(debts.reduce((s,p)=>s+owed(p),0));
  const L=$("dl");L.innerHTML="";
  if(!debts.length)L.appendChild(h("div","empty","Henüz borç kaydı yok."));
  debts.slice().sort((a,b)=>owed(b)-owed(a)).forEach(p=>{
    const c=h("div","card"),hd=h("div","ph"),k=lc(p.name);
    hd.appendChild(h("span","",(open.has(k)?"▾ ":"▸ ")+p.name));hd.appendChild(h("b","",fmt(owed(p))));
    hd.addEventListener("click",()=>{open.has(k)?open.delete(k):open.add(k);renderDebts()});c.appendChild(hd);
    if(open.has(k)){
      p.entries.slice().sort((a,b)=>b.ts-a.ts).forEach(e=>{
        const r=h("div","ri"),d=h("div");
        d.appendChild(h("b","",(e.amt<0?"− ":"+ ")+fmt(Math.abs(e.amt))));
        d.appendChild(h("small","",new Date(e.ts).toLocaleDateString("tr-TR")+" · "+(e.note||(e.amt<0?"Ödeme":"Borç"))));
        const x=h("button","btn sm bad","Sil");x.addEventListener("click",()=>{if(confirm("Bu kayıt silinsin mi?"))removeEntry(p,e)});
        r.append(d,x);c.appendChild(r);
      });
      const ai=h("input","inp");ai.type="number";ai.placeholder="Tutar (TL)";ai.setAttribute("inputmode","decimal");ai.style.marginTop="12px";
      const ni=h("input","inp");ni.placeholder="Ne verildi? (isteğe bağlı)";
      const go=sg=>{const v=Number(ai.value);if(!(v>0)){toast("Geçerli tutar yaz");return}
        addDebt(p.name,sg*v,ni.value.trim()||(sg<0?"Ödeme":""));
        if(sg<0){pushSale({ts:Date.now(),day:dayKey(new Date()),total:v,pay:"nakit",type:"tahsilat",who:p.name});toast("Ödeme alındı")}};
      const b1=h("button","btn","Borç Ekle"),b2=h("button","btn alt","Ödeme Al"),b3=h("button","btn alt","Kişiyi Sil");
      b2.style.marginTop="8px";b3.style.marginTop="8px";
      b1.addEventListener("click",()=>go(1));b2.addEventListener("click",()=>go(-1));
      b3.addEventListener("click",()=>{if(confirm(p.name+" kişisinin tüm kayıtları silinsin mi?"))removePerson(p)});
      c.append(ai,ni,b1,b2,b3);
    }
    L.appendChild(c);
  });
}

/* sekmeler */
document.querySelectorAll("#nav button").forEach(b=>b.addEventListener("click",()=>{
  const t=Number(b.dataset.t);
  document.querySelectorAll(".tab").forEach((s,i)=>s.classList.toggle("on",i===t));
  document.querySelectorAll("#nav button").forEach(x=>x.classList.toggle("on",x===b));
  window.scrollTo(0,0);
}));
function renderAll(){renderCart();renderCiro();renderDebts()}

/* ortak kayıt */
async function initDb(){
  const st=t=>$("st").textContent=t;
  try{
    if(typeof claude==="undefined"){st("Bu telefonda kayıtlı");return}
    const d=await claude.use("db");
    if(!d){st("Ortak kayıt kapalı · bu telefonda kayıtlı");return}
    db=d;
    const timer=setTimeout(()=>st("Ortak kayda henüz ulaşılamıyor…"),10000);
    const err=e=>{clearTimeout(timer);st("Ortak kayıt hatası: "+((e&&e.code)||"bilinmiyor"))};
    d.collection("sales").onSnapshot(s=>{clearTimeout(timer);
      sales=s.docs.map(x=>({id:x.id,...x.data()})).filter(x=>Number.isFinite(x.total)&&Number.isFinite(x.ts)&&typeof x.day==="string");
      st("🔗 Ortak kayıt açık");renderCiro()},err);
    d.collection("debtEntries").onSnapshot(s=>{
      const rows=s.docs.map(x=>({id:x.id,...x.data()})).filter(x=>typeof x.name==="string"&&Number.isFinite(x.amt)&&Number.isFinite(x.ts)).sort((a,b)=>a.ts-b.ts);
      const m=new Map();
      rows.forEach(r=>{const k=lc(r.name);if(!m.has(k))m.set(k,{name:r.name,entries:[]});m.get(k).entries.push({id:r.id,ts:r.ts,amt:r.amt,note:typeof r.note==="string"?r.note:""})});
      debts=Array.from(m.values());renderDebts()},err);
  }catch(e){st("Bu telefonda kayıtlı")}
}
renderAll();initDb();
</script>
</body>
</html>
