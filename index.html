
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101810">
    <title>Meyve Hesaplayıcı</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #101810;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 25px 15px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: #1b271c;
            padding: 25px;
            border-radius: 22px;
            border: 1px solid #304333;
            height: fit-content;
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .icon {
            font-size: 45px;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 25px;
            margin-bottom: 8px;
        }

        .header p {
            color: #a5b6a5;
            font-size: 14px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 9px;
            font-size: 14px;
            color: #d7e5d7;
        }

        input {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid #405541;
            background: #101810;
            color: white;
            font-size: 18px;
            outline: none;
        }

        input:focus {
            border-color: #7bc67b;
        }

        .result {
            background: #263b29;
            padding: 22px;
            border-radius: 15px;
            text-align: center;
            margin: 22px 0 15px;
        }

        .result p {
            color: #b9cbb9;
            font-size: 14px;
            margin-bottom: 10px;
        }

        #total {
            font-size: 34px;
            font-weight: bold;
            color: #8ce28c;
            overflow-wrap: anywhere;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:active {
            transform: scale(0.98);
        }

        .add-button {
            background: #75bd75;
            color: #102010;
        }

        .reset-button {
            background: #344536;
            color: white;
            margin-top: 12px;
        }

        .section-title {
            font-size: 17px;
            margin: 28px 0 15px;
        }

        .list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .item {
            background: #26352a;
            padding: 14px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .item-price {
            font-weight: bold;
            color: #8ce28c;
            font-size: 16px;
        }

        .delete-button {
            width: auto;
            padding: 8px 12px;
            background: #59312f;
            color: #ffb5ae;
            font-size: 13px;
        }

        .grand-total {
            background: #263b29;
            border: 1px solid #405541;
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
            text-align: center;
        }

        .grand-total p {
            color: #b9cbb9;
            margin-bottom: 10px;
            font-size: 14px;
        }

        #grandTotal {
            font-size: 30px;
            color: #8ce28c;
            font-weight: bold;
        }

        .empty {
            text-align: center;
            color: #829382;
            font-size: 14px;
            padding: 15px 0;
        }

        .footer {
            text-align: center;
            color: #829382;
            font-size: 12px;
            line-height: 1.8;
            margin-top: 25px;
        }

        .footer strong {
            color: #a5c5a5;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">
            <div class="icon">🍎</div>
            <h1>Meyve Hesaplayıcı</h1>
            <p>Hesapla, onayla ve toplamı öğren.</p>
        </div>

        <div class="input-group">
            <label for="grams">Ağırlık (Gram)</label>
            <input
                type="number"
                id="grams"
                placeholder="Örn: 750"
                min="0"
                step="any"
                inputmode="decimal"
            >
        </div>

        <div class="input-group">
            <label for="price">Kilogram Fiyatı (TL)</label>
            <input
                type="number"
                id="price"
                placeholder="Örn: 45"
                min="0"
                step="any"
                inputmode="decimal"
            >
        </div>

        <div class="result">
            <p>Hesaplanan Tutar</p>
            <div id="total">0,00 TL</div>
        </div>

        <button class="add-button" onclick="addPrice()">
            ✓ Tutarı Onayla
        </button>

        <h2 class="section-title">Onaylanan Tutarlar</h2>

        <div class="list" id="priceList">
            <div class="empty">Henüz tutar eklenmedi.</div>
        </div>

        <div class="grand-total">
            <p>Genel Toplam</p>
            <div id="grandTotal">0,00 TL</div>
        </div>

        <button class="reset-button" onclick="resetAll()">
            Tümünü Sıfırla
        </button>

        <div class="footer">
            Meyve Hesaplayıcı © 2026
            <br>
            <strong>Bu site Furkan tarafından yapılmıştır. ❤️</strong>
        </div>

    </div>

    <script>
        const gramsInput = document.getElementById("grams");
        const priceInput = document.getElementById("price");
        const totalDisplay = document.getElementById("total");
        const grandTotalDisplay = document.getElementById("grandTotal");
        const priceList = document.getElementById("priceList");

        let prices = [];

        function formatMoney(amount) {
            return amount.toLocaleString("tr-TR", {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }) + " TL";
        }

        function calculate() {
            const grams = Number(gramsInput.value);
            const price = Number(priceInput.value);

            if (
                gramsInput.value === "" ||
                priceInput.value === "" ||
                !Number.isFinite(grams) ||
                !Number.isFinite(price) ||
                grams < 0 ||
                price < 0
            ) {
                totalDisplay.textContent = "0,00 TL";
                return;
            }

            const total = (grams / 1000) * price;

            totalDisplay.textContent = formatMoney(total);
        }

        function addPrice() {
            if (
                gramsInput.value.trim() === "" ||
                priceInput.value.trim() === ""
            ) {
                alert("Lütfen gramaj ve kilogram fiyatını gir.");
                return;
            }

            const grams = Number(gramsInput.value);
            const price = Number(priceInput.value);

            if (
                !Number.isFinite(grams) ||
                !Number.isFinite(price) ||
                grams < 0 ||
                price < 0
            ) {
                alert("Lütfen geçerli değerler gir.");
                return;
            }

            const calculatedPrice = (grams / 1000) * price;

            prices.push(calculatedPrice);

            renderPrices();

            // Yeni ürün için alanları temizle
            gramsInput.value = "";
            priceInput.value = "";
            totalDisplay.textContent = "0,00 TL";

            gramsInput.focus();
        }

        function renderPrices() {
            priceList.innerHTML = "";

            if (prices.length === 0) {
                priceList.innerHTML =
                    '<div class="empty">Henüz tutar eklenmedi.</div>';
            }

            prices.forEach((price, index) => {
                const item = document.createElement("div");
                item.className = "item";

                const priceText = document.createElement("span");
                priceText.className = "item-price";
                priceText.textContent = formatMoney(price);

                const deleteButton = document.createElement("button");
                deleteButton.className = "delete-button";
                deleteButton.textContent = "Sil";
                deleteButton.addEventListener("click", () => {
                    deletePrice(index);
                });

                item.appendChild(priceText);
                item.appendChild(deleteButton);

                priceList.appendChild(item);
            });

            const sum = prices.reduce((total, price) => total + price, 0);

            grandTotalDisplay.textContent = formatMoney(sum);
        }

        function deletePrice(index) {
            prices.splice(index, 1);
            renderPrices();
        }

        function resetAll() {
            if (prices.length === 0 &&
                gramsInput.value === "" &&
                priceInput.value === "") {
                return;
            }

            if (!confirm("Tüm tutarları silmek istediğine emin misin?")) {
                return;
            }

            prices = [];

            gramsInput.value = "";
            priceInput.value = "";
            totalDisplay.textContent = "0,00 TL";

            renderPrices();
        }

        gramsInput.addEventListener("input", calculate);
        priceInput.addEventListener("input", calculate);

        renderPrices();
    </script>

</body>
</html>
