<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101810">
<title>Market Hesaplayıcı</title>
<style>
:root{color-scheme:dark;--bg:#101810;--card:#1b271c;--line:#304333;--field:#405541;--panel:#263b29;--item:#26352a;--text:#fff;--muted:#a5b6a5;--accent:#8ce28c;--btn:#75bd75;--btn-text:#102010;--del-bg:#59312f;--del-text:#ffb5ae;--sec:#344536;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:var(--bg);color:var(--text);min-height:100vh;display:flex;justify-content:center;padding:25px 15px}
.container{width:100%;max-width:420px;background:var(--card);padding:25px;border-radius:22px;border:1px solid var(--line);height:fit-content}
.header{text-align:center;margin-bottom:22px}
.icon{font-size:45px;margin-bottom:10px}
h1{font-size:25px;margin-bottom:8px}
.header p{color:var(--muted);font-size:14px}
.tabs{display:flex;gap:8px;margin-bottom:20px}
.tab{flex:1;padding:12px;border-radius:12px;background:var(--sec);color:var(--text);font-size:14px}
.tab.active{background:var(--btn);color:var(--btn-text)}
.input-group{margin-bottom:18px}
label{display:block;margin-bottom:9px;font-size:14px;color:#d7e5d7}
input{width:100%;padding:16px;border-radius:12px;border:1px solid var(--field);background:var(--bg);color:var(--text);font-size:18px;outline:none}
input:focus{border-color:#7bc67b}
.result{background:var(--panel);padding:22px;border-radius:15px;text-align:center;margin:22px 0 15px}
.result p,.grand-total p{color:#b9cbb9;font-size:14px;margin-bottom:10px}
#total{font-size:34px;font-weight:bold;color:var(--accent);overflow-wrap:anywhere}
button{width:100%;padding:15px;border:none;border-radius:12px;font-size:15px;font-weight:bold;cursor:pointer}
button:active{transform:scale(.98)}
.add-button{background:var(--btn);color:var(--btn-text)}
.reset-button{background:var(--sec);color:var(--text);margin-top:12px}
.section-title{font-size:17px;margin:28px 0 15px}
.list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--item);padding:14px;border-radius:12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.item-info{display:flex;flex-direction:column;gap:4px;min-width:0}
.item-detail{font-size:12px;color:var(--muted)}
.item-price{font-weight:bold;color:var(--accent);font-size:16px}
.delete-button{width:auto;padding:8px 12px;background:var(--del-bg);color:var(--del-text);font-size:13px}
.grand-total{background:var(--panel);border:1px solid var(--field);border-radius:15px;padding:20px;margin-top:20px;text-align:center}
#ciro,#grandTotal,#debtTotal{font-size:30px;color:var(--accent);font-weight:bold;overflow-wrap:anywhere}
.empty{text-align:center;color:#829382;font-size:14px;padding:15px 0}
.footer{text-align:center;color:#829382;font-size:12px;line-height:1.8;margin-top:25px}
.footer strong{color:#a5c5a5}
.debt-card{background:var(--item);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.debt-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.debt-name{font-weight:bold;font-size:17px;overflow-wrap:anywhere}
.debt-owed{font-weight:bold;font-size:18px;color:#ffd27a;white-space:nowrap}
.debt-owed.zero{color:var(--accent)}
.debt-entry{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:6px}
.debt-entry span{flex:1;min-width:0;overflow-wrap:anywhere}
.debt-entry b{color:#ffd27a;white-space:nowrap}
.debt-entry b.pay{color:var(--accent)}
.x-button{width:auto;padding:4px 9px;background:var(--del-bg);color:var(--del-text);font-size:12px}
.debt-card input{padding:12px;font-size:16px}
.debt-actions{display:flex;gap:8px}
.debt-actions button{padding:12px 8px;font-size:14px}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="icon">🛒</div>
    <h1>Market Hesaplayıcı</h1>
    <p>Hesapla, onayla ve toplamı öğren.</p>
  </div>

  <div class="tabs">
    <button class="tab active" id="tabWeight" onclick="setMode('weight')">🍎 Tartılı</button>
    <button class="tab" id="tabPiece" onclick="setMode('piece')">🍫 Adetli</button>
  </div>

  <div class="input-group">
    <label for="qty" id="qtyLabel">Ağırlık (Gram)</label>
    <input type="number" id="qty" placeholder="Örn: 750" min="0" step="any" inputmode="decimal">
  </div>
  <div class="input-group">
    <label for="price" id="priceLabel">Kilogram Fiyatı (TL)</label>
    <input type="number" id="price" placeholder="Örn: 45" min="0" step="any" inputmode="decimal">
  </div>

  <div class="result">
    <p>Hesaplanan Tutar</p>
    <div id="total">0,00 TL</div>
  </div>

  <button class="add-button" onclick="addItem()">✓ Tutarı Onayla</button>

  <h2 class="section-title">Onaylanan Tutarlar</h2>
  <div class="list" id="list"></div>

  <div class="grand-total">
    <p>Genel Toplam</p>
    <div id="grandTotal">0,00 TL</div>
  </div>
  <button class="add-button" style="margin-top:12px" onclick="completeSale()">💰 Satışı Tamamla</button>
  <button class="reset-button" onclick="resetAll()">Sepeti Temizle</button>

  <div class="input-group" style="margin-top:18px">
    <label for="basketDebtName">Veresiye ise kişi adı</label>
    <input type="text" id="basketDebtName" list="names" placeholder="İsim" style="font-size:16px;margin-bottom:10px">
    <button class="reset-button" style="margin-top:0" onclick="debtFromBasket()">📒 Sepeti Borca Yaz</button>
  </div>

  <h2 class="section-title">Bugünkü Ciro</h2>
  <div class="grand-total" style="margin-top:0">
    <p id="ciroCount">Bugün 0 satış</p>
    <div id="ciro">0,00 TL</div>
  </div>
  <div class="list" id="sales" style="margin-top:12px"></div>

  <h2 class="section-title">Geçmiş Günler</h2>
  <div class="list" id="days"></div>
  <button class="reset-button" onclick="resetCiro()">Ciroyu Sıfırla</button>

  <h2 class="section-title">📒 Borç Defteri</h2>
  <div class="grand-total" style="margin-top:0">
    <p>Toplam Alacak</p>
    <div id="debtTotal">0,00 TL</div>
  </div>
  <div class="input-group" style="margin-top:16px">
    <label for="newName">Yeni borç yaz</label>
    <input type="text" id="newName" list="names" placeholder="İsim" style="font-size:16px;margin-bottom:8px">
    <input type="number" id="newAmt" placeholder="Tutar (TL)" min="0" step="any" inputmode="decimal" style="font-size:16px;margin-bottom:8px">
    <input type="text" id="newNote" placeholder="Ne verildi? (örn: 2 ekmek, süt)" style="font-size:16px;margin-bottom:10px">
    <button class="add-button" onclick="addDebtForm()">+ Borç Yaz</button>
  </div>
  <datalist id="names"></datalist>
  <div class="list" id="debts"></div>

  <div class="footer">
    Market Hesaplayıcı © 2026<br>
    <strong>Bu site Furkan tarafından yapılmıştır. ❤️</strong>
  </div>
</div>

<script>
const qtyEl = document.getElementById("qty");
const priceEl = document.getElementById("price");
const totalEl = document.getElementById("total");
const grandEl = document.getElementById("grandTotal");
const listEl = document.getElementById("list");

let mode = "weight";
const KEY = "market-hesap-v1";
function load(){
  try{
    const d = JSON.parse(localStorage.getItem(KEY));
    return Array.isArray(d) ? d.filter(x => x && Number.isFinite(x.total) && typeof x.detail === "string") : [];
  }catch(e){ return []; }
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(items)); }catch(e){}
}
let items = load();

const SKEY = "market-ciro-v1";
function loadSales(){
  try{
    const d = JSON.parse(localStorage.getItem(SKEY));
    return Array.isArray(d) ? d.filter(x => x && Number.isFinite(x.total) && Number.isFinite(x.ts) && typeof x.day === "string") : [];
  }catch(e){ return []; }
}
function saveSales(){
  try{ localStorage.setItem(SKEY, JSON.stringify(sales)); }catch(e){}
}
let sales = loadSales();
const dayKey = d => d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");

function completeSale(){
  if(items.length === 0){ alert("Sepet boş."); return; }
  const now = new Date();
  sales.push({ ts: now.getTime(), day: dayKey(now), total: items.reduce((s,it)=>s+it.total,0) });
  saveSales();
  items = [];
  render();
  renderCiro();
}

function makeRow(priceText, detailText, onDelete){
  const row = document.createElement("div");
  row.className = "item";
  const info = document.createElement("div");
  info.className = "item-info";
  const p = document.createElement("span");
  p.className = "item-price";
  p.textContent = priceText;
  const d = document.createElement("span");
  d.className = "item-detail";
  d.textContent = detailText;
  info.append(p, d);
  row.appendChild(info);
  if(onDelete){
    const del = document.createElement("button");
    del.className = "delete-button";
    del.textContent = "Sil";
    del.addEventListener("click", onDelete);
    row.appendChild(del);
  }
  return row;
}

function renderCiro(){
  const today = dayKey(new Date());
  const t = sales.filter(s => s.day === today);
  document.getElementById("ciro").textContent = fmt(t.reduce((a,s)=>a+s.total,0));
  document.getElementById("ciroCount").textContent = "Bugün " + t.length + " satış";

  const sl = document.getElementById("sales");
  sl.innerHTML = "";
  if(t.length === 0) sl.innerHTML = '<div class="empty">Bugün satış yok.</div>';
  t.slice().reverse().forEach(s => {
    const time = new Date(s.ts).toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"});
    sl.appendChild(makeRow(fmt(s.total), time, () => {
      if(confirm("Bu satışı ciro’dan silmek istiyor musun?")){
        sales = sales.filter(x => x !== s);
        saveSales();
        renderCiro();
      }
    }));
  });

  const map = {};
  sales.forEach(s => {
    if(s.day !== today){
      map[s.day] = map[s.day] || { n: 0, sum: 0 };
      map[s.day].n++;
      map[s.day].sum += s.total;
    }
  });
  const dl = document.getElementById("days");
  dl.innerHTML = "";
  const keys = Object.keys(map).sort().reverse();
  if(keys.length === 0) dl.innerHTML = '<div class="empty">Geçmiş gün yok.</div>';
  keys.forEach(k => {
    const [y,m,d] = k.split("-").map(Number);
    const label = new Date(y, m-1, d).toLocaleDateString("tr-TR") + " · " + map[k].n + " satış";
    dl.appendChild(makeRow(fmt(map[k].sum), label, null));
  });
}

const DKEY = "market-borc-v1";
function loadDebts(){
  try{
    const d = JSON.parse(localStorage.getItem(DKEY));
    if(!Array.isArray(d)) return [];
    return d.filter(x => x && typeof x.name === "string" && Array.isArray(x.entries)).map(x => ({
      name: x.name,
      entries: x.entries.filter(e => e && Number.isFinite(e.amt) && Number.isFinite(e.ts)).map(e => ({ ts: e.ts, amt: e.amt, note: typeof e.note === "string" ? e.note : "" }))
    }));
  }catch(e){ return []; }
}
function saveDebts(){
  try{ localStorage.setItem(DKEY, JSON.stringify(debts)); }catch(e){}
}
let debts = loadDebts();
const owed = p => p.entries.reduce((s,e) => s + e.amt, 0);
const mk = (tag, cls) => { const e = document.createElement(tag); if(cls) e.className = cls; return e; };

function addEntry(name, amt, note){
  name = name.trim();
  if(!name){ alert("Lütfen isim yaz."); return false; }
  const key = name.toLocaleLowerCase("tr-TR");
  let p = debts.find(x => x.name.toLocaleLowerCase("tr-TR") === key);
  if(!p){ p = { name: name, entries: [] }; debts.push(p); }
  p.entries.push({ ts: Date.now(), amt: amt, note: note.trim() });
  saveDebts();
  renderDebts();
  return true;
}

function debtFromBasket(){
  if(items.length === 0){ alert("Sepet boş."); return; }
  const nameEl = document.getElementById("basketDebtName");
  const sum = items.reduce((s,it) => s + it.total, 0);
  const note = items.map(it => it.detail).join(", ");
  if(addEntry(nameEl.value, sum, note)){
    items = [];
    render();
    nameEl.value = "";
  }
}

function addDebtForm(){
  const n = document.getElementById("newName");
  const a = document.getElementById("newAmt");
  const t = document.getElementById("newNote");
  const v = Number(a.value);
  if(a.value.trim() === "" || !Number.isFinite(v) || v <= 0){ alert("Lütfen geçerli bir tutar gir."); return; }
  if(addEntry(n.value, v, t.value)){ n.value = ""; a.value = ""; t.value = ""; }
}

function renderDebts(){
  const list = document.getElementById("debts");
  list.innerHTML = "";
  const dl = document.getElementById("names");
  dl.innerHTML = "";
  debts.forEach(p => { const o = document.createElement("option"); o.value = p.name; dl.appendChild(o); });
  document.getElementById("debtTotal").textContent = fmt(debts.reduce((s,p) => s + owed(p), 0));
  if(debts.length === 0){
    list.innerHTML = '<div class="empty">Henüz borç kaydı yok.</div>';
    return;
  }
  debts.slice().sort((a,b) => owed(b) - owed(a)).forEach(p => {
    const card = mk("div", "debt-card");
    const head = mk("div", "debt-head");
    const nm = mk("span", "debt-name");
    nm.textContent = p.name;
    const ow = mk("span", "debt-owed" + (owed(p) <= 0 ? " zero" : ""));
    ow.textContent = fmt(owed(p));
    head.append(nm, ow);
    card.appendChild(head);

    p.entries.slice().reverse().forEach(e => {
      const row = mk("div", "debt-entry");
      const left = mk("span");
      left.textContent = new Date(e.ts).toLocaleDateString("tr-TR") + " · " + (e.note || (e.amt < 0 ? "Ödeme" : "Borç"));
      const right = mk("b", e.amt < 0 ? "pay" : "");
      right.textContent = (e.amt < 0 ? "− " : "+ ") + fmt(Math.abs(e.amt));
      const x = mk("button", "x-button");
      x.textContent = "×";
      x.addEventListener("click", () => {
        if(confirm("Bu kaydı silmek istiyor musun?")){
          p.entries = p.entries.filter(z => z !== e);
          saveDebts();
          renderDebts();
        }
      });
      row.append(left, right, x);
      card.appendChild(row);
    });

    const amtIn = mk("input");
    amtIn.type = "number"; amtIn.placeholder = "Tutar (TL)"; amtIn.min = "0"; amtIn.step = "any"; amtIn.setAttribute("inputmode", "decimal");
    const noteIn = mk("input");
    noteIn.type = "text"; noteIn.placeholder = "Ne verildi? (isteğe bağlı)";
    card.append(amtIn, noteIn);

    const act = sign => {
      const v = Number(amtIn.value);
      if(amtIn.value.trim() === "" || !Number.isFinite(v) || v <= 0){ alert("Lütfen geçerli bir tutar gir."); return; }
      const note = noteIn.value.trim() || (sign < 0 ? "Ödeme" : "");
      addEntry(p.name, sign * v, note);
    };
    const actions = mk("div", "debt-actions");
    const addB = mk("button", "add-button");
    addB.textContent = "+ Borç Ekle";
    addB.addEventListener("click", () => act(1));
    const payB = mk("button", "reset-button");
    payB.style.marginTop = "0";
    payB.textContent = "Ödeme Al";
    payB.addEventListener("click", () => act(-1));
    const delB = mk("button", "delete-button");
    delB.textContent = "Sil";
    delB.addEventListener("click", () => {
      if(confirm(p.name + " kişisinin tüm kayıtları silinsin mi?")){
        debts = debts.filter(z => z !== p);
        saveDebts();
        renderDebts();
      }
    });
    actions.append(addB, payB, delB);
    card.appendChild(actions);
    list.appendChild(card);
  });
}

function resetCiro(){
  if(sales.length === 0) return;
  if(!confirm("Tüm ciro kayıtları silinecek. Emin misin?")) return;
  sales = [];
  saveSales();
  renderCiro();
}

const fmt = n => n.toLocaleString("tr-TR",{minimumFractionDigits:2,maximumFractionDigits:2}) + " TL";
const num = n => n.toLocaleString("tr-TR",{maximumFractionDigits:2});

function setMode(m){
  mode = m;
  document.getElementById("tabWeight").classList.toggle("active", m==="weight");
  document.getElementById("tabPiece").classList.toggle("active", m==="piece");
  document.getElementById("qtyLabel").textContent = m==="weight" ? "Ağırlık (Gram)" : "Adet";
  document.getElementById("priceLabel").textContent = m==="weight" ? "Kilogram Fiyatı (TL)" : "Tanesi (TL)";
  qtyEl.placeholder = m==="weight" ? "Örn: 750" : "Örn: 3";
  priceEl.placeholder = m==="weight" ? "Örn: 45" : "Örn: 25";
  qtyEl.value = ""; priceEl.value = "";
  calculate();
}

function compute(){
  if(qtyEl.value.trim()==="" || priceEl.value.trim()==="") return null;
  const q = Number(qtyEl.value), p = Number(priceEl.value);
  if(!Number.isFinite(q) || !Number.isFinite(p) || q<0 || p<0) return null;
  return { q, p, total: mode==="weight" ? (q/1000)*p : q*p };
}

function calculate(){
  const r = compute();
  totalEl.textContent = r ? fmt(r.total) : "0,00 TL";
}

function addItem(){
  if(qtyEl.value.trim()==="" || priceEl.value.trim()===""){
    alert(mode==="weight" ? "Lütfen gramaj ve kilogram fiyatını gir." : "Lütfen adet ve birim fiyatını gir.");
    return;
  }
  const r = compute();
  if(!r){ alert("Lütfen geçerli değerler gir."); return; }
  items.push({
    total: r.total,
    detail: mode==="weight"
      ? num(r.q) + " g × " + num(r.p) + " TL/kg"
      : num(r.q) + " adet × " + num(r.p) + " TL"
  });
  render();
  qtyEl.value = ""; priceEl.value = "";
  totalEl.textContent = "0,00 TL";
  qtyEl.focus();
}

function render(){
  listEl.innerHTML = "";
  if(items.length===0){
    listEl.innerHTML = '<div class="empty">Henüz tutar eklenmedi.</div>';
  }
  items.forEach((it,i)=>{
    const row = document.createElement("div");
    row.className = "item";
    const info = document.createElement("div");
    info.className = "item-info";
    const p = document.createElement("span");
    p.className = "item-price";
    p.textContent = fmt(it.total);
    const d = document.createElement("span");
    d.className = "item-detail";
    d.textContent = it.detail;
    info.append(p,d);
    const del = document.createElement("button");
    del.className = "delete-button";
    del.textContent = "Sil";
    del.addEventListener("click",()=>{ items.splice(i,1); render(); });
    row.append(info,del);
    listEl.appendChild(row);
  });
  grandEl.textContent = fmt(items.reduce((s,it)=>s+it.total,0));
  save();
}

function resetAll(){
  if(items.length===0 && qtyEl.value==="" && priceEl.value==="") return;
  if(!confirm("Tüm tutarları silmek istediğine emin misin?")) return;
  items = [];
  qtyEl.value = ""; priceEl.value = "";
  totalEl.textContent = "0,00 TL";
  render();
}

qtyEl.addEventListener("input", calculate);
priceEl.addEventListener("input", calculate);
render();
renderCiro();
renderDebts();
</script>
</body>
</html>
